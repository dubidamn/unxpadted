<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clash of Unxpadted</title>

  <!-- PWA & Chrome App Fullscreen Meta -->
  <meta name="theme-color" content="#9333EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Unxpadted">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="/socket.io/socket.io.js"></script>
  <script>
    if (typeof io === 'undefined') {
      document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');
    }
  </script>
  <script src="js/audio.js"></script>
  <script src="js/pwa-fullscreen.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #08090d;
      background-image:
        radial-gradient(ellipse at 50% 10%, rgba(147, 51, 234, 0.22) 0%, transparent 65%),
        linear-gradient(rgba(147, 51, 234, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(147, 51, 234, 0.06) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(16px, 3vh, 32px) clamp(20px, 4vw, 48px);
    }

    /* Top Logo Header */
    .portal-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .portal-logo {
      height: clamp(48px, 9vh, 76px);
      max-width: 80vw;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.7));
    }

    /* 3 Big Touch Action Buttons */
    .touch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(16px, 2.5vw, 32px);
      width: 100%;
      max-width: 1280px;
      flex: 1;
      max-height: 520px;
      align-items: stretch;
      margin: auto 0;
    }

    .touch-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2.5vh, 24px);
      padding: clamp(20px, 3vh, 40px) 20px;
      text-decoration: none;
      color: #ffffff;
      background: linear-gradient(180deg, rgba(26, 28, 44, 0.9) 0%, rgba(13, 14, 24, 0.95) 100%);
      border: 2px solid var(--card-border, rgba(168, 85, 247, 0.4));
      border-radius: 20px;
      cursor: pointer;
      isolation: isolate;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    /* Angular / Chamfer Accents */
    .touch-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--card-glow-color, #a855f7);
      box-shadow: 0 0 16px var(--card-glow-color, #a855f7);
      opacity: 0.8;
      transition: opacity 0.2s ease, height 0.2s ease;
    }

    .touch-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, var(--card-glow-soft, rgba(168, 85, 247, 0.15)) 0%, transparent 70%);
      opacity: 0.5;
      transition: opacity 0.2s ease;
      z-index: -1;
    }

    .touch-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--card-glow-color, #a855f7);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.8), 0 0 32px var(--card-glow-soft, rgba(168, 85, 247, 0.35));
    }

    .touch-card:hover::before {
      opacity: 1;
      height: 6px;
    }

    .touch-card:hover::after {
      opacity: 1;
    }

    .touch-card:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.9), 0 0 18px var(--card-glow-soft, rgba(168, 85, 247, 0.4));
    }

    /* Distinct Themes */
    /* 1. Broadcast */
    .touch-card.card-broadcast {
      --card-border: rgba(168, 85, 247, 0.5);
      --card-glow-color: #c084fc;
      --card-glow-soft: rgba(168, 85, 247, 0.25);
    }
    .touch-card.card-broadcast .touch-icon-wrap {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(88, 28, 135, 0.3) 100%);
      border-color: #a855f7;
      color: #e9d5ff;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    /* 2. Team X */
    .touch-card.card-team-x {
      --card-border: rgba(255, 71, 87, 0.5);
      --card-glow-color: #ff4757;
      --card-glow-soft: rgba(255, 71, 87, 0.25);
    }
    .touch-card.card-team-x .touch-icon-wrap {
      background: linear-gradient(135deg, rgba(255, 71, 87, 0.3) 0%, rgba(153, 27, 27, 0.3) 100%);
      border-color: #ff4757;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
    }
    .touch-card.card-team-x .touch-card-title {
      color: #ff4757;
      text-shadow: 0 0 16px rgba(255, 71, 87, 0.6);
    }

    /* 3. Team Y */
    .touch-card.card-team-y {
      --card-border: rgba(0, 210, 211, 0.5);
      --card-glow-color: #00d2d3;
      --card-glow-soft: rgba(0, 210, 211, 0.25);
    }
    .touch-card.card-team-y .touch-icon-wrap {
      background: linear-gradient(135deg, rgba(0, 210, 211, 0.3) 0%, rgba(15, 118, 110, 0.3) 100%);
      border-color: #00d2d3;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 210, 211, 0.4);
    }
    .touch-card.card-team-y .touch-card-title {
      color: #00d2d3;
      text-shadow: 0 0 16px rgba(0, 210, 211, 0.6);
    }

    /* Card Elements */
    .touch-icon-wrap {
      width: clamp(72px, 12vh, 108px);
      height: clamp(72px, 12vh, 108px);
      border-radius: 24px;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .touch-icon-svg {
      width: clamp(36px, 6vh, 54px);
      height: clamp(36px, 6vh, 54px);
    }

    .touch-card:hover .touch-icon-wrap {
      transform: scale(1.08);
    }

    .touch-card-title {
      font-family: var(--font-display);
      font-size: clamp(20px, 3.2vh, 32px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      transition: all 0.2s ease;
    }

    .touch-card.card-broadcast .touch-card-title {
      color: #ffffff;
      text-shadow: 0 0 16px rgba(168, 85, 247, 0.6);
    }

    .touch-card-badge {
      font-family: var(--font-orbitron);
      font-size: clamp(11px, 1.6vh, 14px);
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 6px 16px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
    }

    /* Responsive for Tablets & Mobile */
    @media (max-width: 768px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
        padding: 24px 16px;
        gap: 20px;
      }
      .touch-grid {
        grid-template-columns: 1fr;
        max-height: none;
      }
      .touch-card {
        padding: 28px 20px;
        flex-direction: row;
        gap: 20px;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- Persistent Connection Status Dot (Bottom Right) -->
  <div id="connection-dot" class="connection-status-dot"></div>

  <!-- Top Logo -->
  <header class="portal-header">
    <img src="assets/Global Assets/Logotype_Overlay@2x.png" alt="Clash of Unxpadted" class="portal-logo">
  </header>

  <!-- 3 Big Touch Shortcuts -->
  <main class="touch-grid">

    <!-- 1. BROADCAST -->
    <a href="broadcast.html" class="touch-card card-broadcast" id="link-broadcast">
      <div class="touch-icon-wrap">
        <svg class="touch-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <div class="touch-card-title">BROADCAST</div>
      <div class="touch-card-badge">STAGE SCREEN 16:9</div>
    </a>

    <!-- 2. PLAYER TEAM X -->
    <a href="player.html?team=X" class="touch-card card-team-x" id="link-team-x">
      <div class="touch-icon-wrap">
        <svg class="touch-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="3" ry="3"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
      </div>
      <div class="touch-card-title">PLAYER X</div>
      <div class="touch-card-badge" style="border-color: rgba(255, 71, 87, 0.4); color: #ff8b94;">TEAM RED</div>
    </a>

    <!-- 3. PLAYER TEAM Y -->
    <a href="player.html?team=Y" class="touch-card card-team-y" id="link-team-y">
      <div class="touch-icon-wrap">
        <svg class="touch-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="3" ry="3"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
      </div>
      <div class="touch-card-title">PLAYER Y</div>
      <div class="touch-card-badge" style="border-color: rgba(0, 210, 211, 0.4); color: #81ecec;">TEAM CYAN</div>
    </a>

  </main>

  <!-- Floating HUD Controls for PWA Install & Fullscreen Toggle -->
  <div class="pwa-hud-controls">
    <button type="button" class="fullscreen-toggle-btn" onclick="window.toggleFullscreen()" title="Layar Penuh (F)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      <span>FULLSCREEN</span>
    </button>
    <button type="button" id="pwa-install-btn" class="pwa-install-trigger" onclick="window.promptPwaInstall()" style="display: none;" title="Pasang Aplikasi di Chrome">
      <span>📥 INSTALL APP</span>
    </button>
  </div>

  <script>
    // Server query passthrough if specified
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const customServer = urlParams.get('server');
      if (customServer) {
        ['link-broadcast', 'link-team-x', 'link-team-y'].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            const sep = el.href.includes('?') ? '&' : '?';
            el.href = `${el.href}${sep}server=${encodeURIComponent(customServer)}`;
          }
        });
      }
    })();
  </script>
</body>
</html>
