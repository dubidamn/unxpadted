<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash of Unxpadted — Multiview</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --xpad-cyan: #00E5FF;
      --xpad-crimson: #FF3B30;
      --xpad-gm: #A855F7;
    }

    body {
      background-color: #050505;
      color: #FFFFFF;
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Multiview Control Bar */
    .sim-bar {
      background-color: #0A0A0A;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 1000;
      flex-wrap: wrap;
    }

    .sim-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sim-title img {
      height: 24px;
    }

    .sim-badge {
      background: rgba(57, 255, 20, 0.15);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sim-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sim-btn {
      background-color: #141414;
      border: 1px solid var(--border);
      color: #E5E5E5;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .sim-btn:hover {
      background-color: #222;
      border-color: #444;
      color: #fff;
    }

    .sim-btn.active {
      background-color: var(--primary);
      color: #000;
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .sim-select {
      background-color: #141414;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    /* Main Multiview Canvas Grid */
    .sim-viewport-grid {
      flex: 1;
      display: grid;
      gap: 14px;
      padding: 14px;
      overflow: auto;
      transition: all 0.3s ease;
    }

    /* Preset 1: Standard 3-Screen View (Display on top, Tablets below) */
    .layout-mode-3screen {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1.1fr 1fr;
      grid-template-areas:
        "display display"
        "teamx   teamy";
    }

    /* Preset 2: 4-Screen Full Studio (Display, GM, Team X, Team Y) */
    .layout-mode-4screen {
      grid-template-columns: 1.2fr 1fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "display gm"
        "teamx   teamy";
    }

    /* Preset 3: Dual Tablets Focus */
    .layout-mode-tablets {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      grid-template-areas:
        "teamx teamy";
    }

    /* Preset 4: Display Focus */
    .layout-mode-display {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "display teamx"
        "display teamy";
    }

    /* Frame Container Box */
    .frame-wrapper {
      background: #0D0D0D;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      position: relative;
      transition: all 0.3s ease;
    }

    .frame-wrapper[data-area="display"] { grid-area: display; border-color: rgba(57, 255, 20, 0.4); }
    .frame-wrapper[data-area="gm"] { grid-area: gm; border-color: rgba(168, 85, 247, 0.4); }
    .frame-wrapper[data-area="teamx"] { grid-area: teamx; border-color: rgba(0, 229, 255, 0.4); }
    .frame-wrapper[data-area="teamy"] { grid-area: teamy; border-color: rgba(255, 59, 48, 0.4); }

    /* Frame Header */
    .frame-header {
      background: #111111;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .frame-title-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--primary);
      box-shadow: 0 0 6px var(--primary-glow);
    }

    .tag-display .tag-dot { background-color: var(--primary); box-shadow: 0 0 6px var(--primary-glow); }
    .tag-gm .tag-dot { background-color: var(--xpad-gm); box-shadow: 0 0 6px var(--xpad-gm); }
    .tag-teamx .tag-dot { background-color: var(--xpad-cyan); box-shadow: 0 0 6px var(--xpad-cyan); }
    .tag-teamy .tag-dot { background-color: var(--xpad-crimson); box-shadow: 0 0 6px var(--xpad-crimson); }

    .frame-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--secondary);
      cursor: pointer;
      padding: 5px;
      border-radius: 4px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .icon-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.12);
    }

    .icon-svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    /* Device Chassis Frame Styling */
    .frame-body {
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .tablet-chassis {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .tablet-bezel {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>

  <!-- Pre-authenticate session storage for iframes on load -->
  <script>
    try {
      sessionStorage.setItem('display_authed', 'true');
      sessionStorage.setItem('gm_authed', 'true');
    } catch(e){}
  </script>

  <!-- Top Multiview Navigation Bar -->
  <header class="sim-bar">
    <div class="sim-title">
      <a href="/index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
        <img src="/assets/unxpadted-logotype.png" alt="Unxpadted">
      </a>
      <span class="sim-badge">MULTIVIEW</span>
    </div>

    <!-- Layout Preset Switcher -->
    <div class="sim-controls">
      <span style="font-size: 11px; color: var(--secondary); font-weight: 700;">LAYOUT:</span>
      <button class="sim-btn active" id="btn-layout-3screen" onclick="setLayout('3screen')">
        3-Screen (Display + X + Y)
      </button>
      <button class="sim-btn" id="btn-layout-4screen" onclick="setLayout('4screen')">
        4-Screen Full
      </button>
      <button class="sim-btn" id="btn-layout-tablets" onclick="setLayout('tablets')">
        Dual Tablets
      </button>
      <button class="sim-btn" id="btn-layout-display" onclick="setLayout('display')">
        Display Focus
      </button>
    </div>

    <!-- Tools & Actions -->
    <div class="sim-controls">
      <button class="sim-btn" onclick="bypassPasscodes()" title="Auto Bypass Passcode Modals">
        Bypass Passcode
      </button>

      <button class="sim-btn" onclick="reloadAllFrames()" title="Reload All Screens">
        Refresh All
      </button>

      <select class="sim-select" id="zoom-select" onchange="applyZoom(this.value)">
        <option value="100">Zoom 100%</option>
        <option value="90">Zoom 90%</option>
        <option value="75" selected>Zoom 75%</option>
        <option value="60">Zoom 60%</option>
      </select>

      <a href="/index.html" class="sim-btn" style="text-decoration: none;">
        Hub
      </a>
    </div>
  </header>

  <!-- Main Viewport Canvas Grid -->
  <main class="sim-viewport-grid layout-mode-3screen" id="viewport-grid">
    
    <!-- 1. MAIN DISPLAY FRAME -->
    <div class="frame-wrapper" data-area="display" id="wrapper-display">
      <div class="frame-header">
        <div class="frame-title-tag tag-display">
          <span class="tag-dot"></span>
          <span style="color: var(--primary);">MAIN DISPLAY</span>
        </div>
        <div class="frame-actions">
          <button class="icon-btn" onclick="reloadFrame('frame-display')" title="Reload Stage Display">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <a href="/display.html" target="_blank" class="icon-btn" title="Open in New Tab" style="text-decoration: none;">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
      <div class="frame-body">
        <div class="tablet-chassis">
          <iframe id="frame-display" class="tablet-bezel" src="/display.html" title="Main Display"></iframe>
        </div>
      </div>
    </div>

    <!-- 2. GAMEMASTER CONTROL PANEL FRAME (Shown in 4-Screen mode) -->
    <div class="frame-wrapper" data-area="gm" id="wrapper-gm" style="display: none;">
      <div class="frame-header">
        <div class="frame-title-tag tag-gm">
          <span class="tag-dot"></span>
          <span style="color: var(--xpad-gm);">GAMEMASTER CONTROL PANEL</span>
        </div>
        <div class="frame-actions">
          <button class="icon-btn" onclick="reloadFrame('frame-gm')" title="Reload GM Panel">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <a href="/gm.html" target="_blank" class="icon-btn" title="Open in New Tab" style="text-decoration: none;">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
      <div class="frame-body">
        <div class="tablet-chassis">
          <iframe id="frame-gm" class="tablet-bezel" src="/gm.html" title="Gamemaster Panel"></iframe>
        </div>
      </div>
    </div>

    <!-- 3. TEAM X TABLET FRAME -->
    <div class="frame-wrapper" data-area="teamx" id="wrapper-teamx">
      <div class="frame-header">
        <div class="frame-title-tag tag-teamx">
          <span class="tag-dot"></span>
          <span style="color: var(--xpad-cyan);">TABLET TEAM X</span>
        </div>
        <div class="frame-actions">
          <button class="icon-btn" onclick="reloadFrame('frame-teamx')" title="Reload Team X Tablet">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <a href="/team.html?team=X" target="_blank" class="icon-btn" title="Open in New Tab" style="text-decoration: none;">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
      <div class="frame-body">
        <div class="tablet-chassis">
          <iframe id="frame-teamx" class="tablet-bezel" src="/team.html?team=X" title="Team X Tablet"></iframe>
        </div>
      </div>
    </div>

    <!-- 4. TEAM Y TABLET FRAME -->
    <div class="frame-wrapper" data-area="teamy" id="wrapper-teamy">
      <div class="frame-header">
        <div class="frame-title-tag tag-teamy">
          <span class="tag-dot"></span>
          <span style="color: var(--xpad-crimson);">TABLET TEAM Y</span>
        </div>
        <div class="frame-actions">
          <button class="icon-btn" onclick="reloadFrame('frame-teamy')" title="Reload Team Y Tablet">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <a href="/team.html?team=Y" target="_blank" class="icon-btn" title="Open in New Tab" style="text-decoration: none;">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
      <div class="frame-body">
        <div class="tablet-chassis">
          <iframe id="frame-teamy" class="tablet-bezel" src="/team.html?team=Y" title="Team Y Tablet"></iframe>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Layout switcher state logic
    const grid = document.getElementById('viewport-grid');
    const wrapperGm = document.getElementById('wrapper-gm');

    function setLayout(mode) {
      // Remove all layout classes
      grid.classList.remove('layout-mode-3screen', 'layout-mode-4screen', 'layout-mode-tablets', 'layout-mode-display');
      
      // Reset active button state
      document.querySelectorAll('.sim-controls .sim-btn').forEach(btn => btn.classList.remove('active'));

      if (mode === '3screen') {
        grid.classList.add('layout-mode-3screen');
        document.getElementById('btn-layout-3screen').classList.add('active');
        wrapperGm.style.display = 'none';
        document.getElementById('wrapper-display').style.display = 'flex';
        document.getElementById('wrapper-teamx').style.display = 'flex';
        document.getElementById('wrapper-teamy').style.display = 'flex';
      } else if (mode === '4screen') {
        grid.classList.add('layout-mode-4screen');
        document.getElementById('btn-layout-4screen').classList.add('active');
        wrapperGm.style.display = 'flex';
        document.getElementById('wrapper-display').style.display = 'flex';
        document.getElementById('wrapper-teamx').style.display = 'flex';
        document.getElementById('wrapper-teamy').style.display = 'flex';
      } else if (mode === 'tablets') {
        grid.classList.add('layout-mode-tablets');
        document.getElementById('btn-layout-tablets').classList.add('active');
        wrapperGm.style.display = 'none';
        document.getElementById('wrapper-display').style.display = 'none';
        document.getElementById('wrapper-teamx').style.display = 'flex';
        document.getElementById('wrapper-teamy').style.display = 'flex';
      } else if (mode === 'display') {
        grid.classList.add('layout-mode-display');
        document.getElementById('btn-layout-display').classList.add('active');
        wrapperGm.style.display = 'none';
        document.getElementById('wrapper-display').style.display = 'flex';
        document.getElementById('wrapper-teamx').style.display = 'flex';
        document.getElementById('wrapper-teamy').style.display = 'flex';
      }
    }

    // Auto bypass passcodes inside all loaded iframes
    function bypassPasscodes() {
      sessionStorage.setItem('display_authed', 'true');
      sessionStorage.setItem('gm_authed', 'true');

      ['frame-display', 'frame-gm', 'frame-teamx', 'frame-teamy'].forEach(id => {
        const frame = document.getElementById(id);
        if (frame && frame.contentWindow) {
          try {
            frame.contentWindow.sessionStorage.setItem('display_authed', 'true');
            frame.contentWindow.sessionStorage.setItem('gm_authed', 'true');
            const modal = frame.contentWindow.document.getElementById('passcode-modal');
            if (modal) modal.style.display = 'none';
          } catch(e){}
        }
      });
    }

    // Reload single frame
    function reloadFrame(frameId) {
      const frame = document.getElementById(frameId);
      if (frame) {
        frame.src = frame.src;
      }
    }

    // Reload all frames
    function reloadAllFrames() {
      ['frame-display', 'frame-gm', 'frame-teamx', 'frame-teamy'].forEach(reloadFrame);
    }

    // Apply Zoom to iframe contents if desired or grid scale
    function applyZoom(scaleVal) {
      const factor = parseInt(scaleVal, 10) / 100;
      document.querySelectorAll('.tablet-bezel').forEach(iframe => {
        try {
          if (iframe.contentWindow && iframe.contentWindow.document && iframe.contentWindow.document.body) {
            iframe.contentWindow.document.body.style.zoom = factor;
          }
        } catch(e){}
      });
    }

    // Initial setup on load: automatically bypass passcode modals
    window.addEventListener('load', () => {
      setTimeout(bypassPasscodes, 500);
      setTimeout(bypassPasscodes, 1500);
    });
  </script>
</body>
</html>
